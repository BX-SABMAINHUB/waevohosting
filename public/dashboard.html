<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WaevoHosting - Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0b0e14;
            color: #e0e5ee;
            min-height: 100vh;
        }

        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        /* HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 2rem;
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(135deg, #a78bfa, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .user-info span {
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .btn-logout {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
            padding: 0.5rem 1.2rem;
            border-radius: 0.6rem;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .btn-logout:hover {
            background: rgba(239, 68, 68, 0.25);
        }

        /* CARDS */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: rgba(18, 24, 38, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 1rem;
            padding: 1.5rem;
            text-align: center;
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 700;
            color: #a78bfa;
        }

        .stat-label {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-top: 0.3rem;
        }

        /* TABLA DE SERVIDORES */
        .servers-section {
            background: rgba(18, 24, 38, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 1rem;
            padding: 1.5rem;
        }

        .servers-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .servers-header h2 {
            font-size: 1.3rem;
        }

        .servers-table {
            width: 100%;
            border-collapse: collapse;
        }

        .servers-table th {
            text-align: left;
            padding: 0.8rem 0.5rem;
            color: #94a3b8;
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .servers-table td {
            padding: 0.8rem 0.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            font-size: 0.9rem;
        }

        .servers-table tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .status-badge {
            display: inline-block;
            padding: 0.2rem 0.8rem;
            border-radius: 999px;
            font-size: 0.7rem;
            font-weight: 600;
        }

        .status-badge.running {
            background: rgba(52, 211, 153, 0.15);
            color: #34d399;
        }

        .status-badge.suspended {
            background: rgba(251, 191, 36, 0.15);
            color: #fbbf24;
        }

        .status-badge.offline {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
        }

        .btn-action {
            padding: 0.3rem 0.8rem;
            border: none;
            border-radius: 0.4rem;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 600;
            transition: all 0.2s;
            margin-right: 0.3rem;
        }

        .btn-suspend {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
        }

        .btn-suspend:hover {
            background: rgba(239, 68, 68, 0.3);
        }

        .btn-unsuspend {
            background: rgba(52, 211, 153, 0.15);
            color: #34d399;
        }

        .btn-unsuspend:hover {
            background: rgba(52, 211, 153, 0.3);
        }

        .btn-delete {
            background: rgba(239, 68, 68, 0.08);
            color: #ef4444;
        }

        .btn-delete:hover {
            background: rgba(239, 68, 68, 0.2);
        }

        .loading-spinner {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #a78bfa;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 3rem 0;
            color: #94a3b8;
        }

        .empty-state .icon {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 1rem;
                align-items: flex-start;
            }
            .servers-table {
                font-size: 0.8rem;
            }
            .btn-action {
                font-size: 0.65rem;
                padding: 0.2rem 0.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-container" id="app">
        <!-- Header -->
        <div class="header">
            <div class="logo">WaevoHosting</div>
            <div class="user-info">
                <span id="userName">Cargando...</span>
                <button class="btn-logout" onclick="logout()">Cerrar sesión</button>
            </div>
        </div>

        <!-- Estadísticas -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="stat-number" id="totalServers">0</div>
                <div class="stat-label">Total servidores</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="runningServers">0</div>
                <div class="stat-label">En ejecución</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="suspendedServers">0</div>
                <div class="stat-label">Suspendidos</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="offlineServers">0</div>
                <div class="stat-label">Offline</div>
            </div>
        </div>

        <!-- Lista de servidores -->
        <div class="servers-section">
            <div class="servers-header">
                <h2>Mis servidores</h2>
                <span style="color:#94a3b8; font-size:0.85rem;" id="serverCount">0 servidores</span>
            </div>
            <div id="serversList">
                <div class="loading-spinner">
                    <div class="spinner"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // DASHBOARD - WaevoHosting
        // ============================================================

        const API_BASE = '/api';

        // Verificar autenticación
        const token = localStorage.getItem('waevohosting_token');
        if (!token) {
            window.location.href = '/login.html';
        }

        // Cargar datos del usuario
        try {
            const user = JSON.parse(localStorage.getItem('waevohosting_user'));
            document.getElementById('userName').textContent = user?.username || 'Usuario';
        } catch (e) {
            document.getElementById('userName').textContent = 'Usuario';
        }

        // ============================================================
        // FUNCIONES DE API (con autenticación)
        // ============================================================

        async function apiRequest(endpoint, options = {}) {
            const response = await fetch(`${API_BASE}${endpoint}`, {
                ...options,
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`,
                    ...options.headers,
                },
            });

            if (response.status === 401) {
                // Token expirado o inválido
                localStorage.removeItem('waevohosting_token');
                localStorage.removeItem('waevohosting_user');
                window.location.href = '/login.html';
                return null;
            }

            return response;
        }

        // ============================================================
        // CARGAR SERVIDORES
        // ============================================================

        async function loadServers() {
            const container = document.getElementById('serversList');
            container.innerHTML = `<div class="loading-spinner"><div class="spinner"></div></div>`;

            try {
                const response = await apiRequest('/servers');
                if (!response || !response.ok) {
                    throw new Error('Error al cargar servidores');
                }

                const data = await response.json();

                if (!data.success) {
                    throw new Error(data.error || 'Error desconocido');
                }

                const servers = data.data || [];

                // Actualizar estadísticas
                const total = servers.length;
                const running = servers.filter(s => s.attributes.status === 'running').length;
                const suspended = servers.filter(s => s.attributes.status === 'suspended').length;
                const offline = servers.filter(s => s.attributes.status === 'offline').length;

                document.getElementById('totalServers').textContent = total;
                document.getElementById('runningServers').textContent = running;
                document.getElementById('suspendedServers').textContent = suspended;
                document.getElementById('offlineServers').textContent = offline;
                document.getElementById('serverCount').textContent = `${total} servidores`;

                // Renderizar tabla
                if (servers.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="icon">🚀</div>
                            <p>No tienes servidores activos</p>
                            <p style="font-size:0.85rem; margin-top:0.5rem;">Crea tu primer servidor desde el panel de Pterodactyl</p>
                        </div>
                    `;
                    return;
                }

                let html = `
                    <table class="servers-table">
                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Estado</th>
                                <th>CPU</th>
                                <th>RAM</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                servers.forEach(server => {
                    const attrs = server.attributes;
                    const status = attrs.status || 'offline';
                    const statusMap = {
                        'running': { label: 'En ejecución', class: 'running' },
                        'suspended': { label: 'Suspendido', class: 'suspended' },
                        'offline': { label: 'Offline', class: 'offline' },
                    };
                    const statusInfo = statusMap[status] || { label: 'Desconocido', class: 'offline' };

                    html += `
                        <tr>
                            <td><strong>${attrs.name}</strong></td>
                            <td><span class="status-badge ${statusInfo.class}">${statusInfo.label}</span></td>
                            <td>${attrs.limits?.cpu || '-'}%</td>
                            <td>${attrs.limits?.memory || '-'} MB</td>
                            <td>
                                ${status === 'suspended' ? `
                                    <button class="btn-action btn-unsuspend" onclick="unsuspendServer('${attrs.id}')">Reanudar</button>
                                ` : `
                                    <button class="btn-action btn-suspend" onclick="suspendServer('${attrs.id}')">Suspender</button>
                                `}
                                <button class="btn-action btn-delete" onclick="deleteServer('${attrs.id}')">Eliminar</button>
                            </td>
                        </tr>
                    `;
                });

                html += `
                        </tbody>
                    </table>
                `;

                container.innerHTML = html;

            } catch (error) {
                console.error('Error:', error);
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">⚠️</div>
                        <p>Error al cargar los servidores</p>
                        <p style="font-size:0.85rem; margin-top:0.5rem; color:#f87171;">${error.message}</p>
                        <button onclick="loadServers()" style="margin-top:1rem; padding:0.5rem 1.5rem; background:#7c6cf0; border:none; border-radius:0.6rem; color:white; cursor:pointer;">Reintentar</button>
                    </div>
                `;
            }
        }

        // ============================================================
        // ACCIONES SOBRE SERVIDORES
        // ============================================================

        async function suspendServer(id) {
            if (!confirm('¿Estás seguro de que quieres suspender este servidor?')) return;
            await performAction(`/servers/${id}/suspend`, 'POST', 'Servidor suspendido correctamente');
        }

        async function unsuspendServer(id) {
            if (!confirm('¿Estás seguro de que quieres reanudar este servidor?')) return;
            await performAction(`/servers/${id}/unsuspend`, 'POST', 'Servidor reanudado correctamente');
        }

        async function deleteServer(id) {
            if (!confirm('⚠️ ¿Estás seguro de que quieres ELIMINAR este servidor? Esta acción no se puede deshacer.')) return;
            await performAction(`/servers/${id}`, 'DELETE', 'Servidor eliminado correctamente');
        }

        async function performAction(endpoint, method, successMessage) {
            try {
                const response = await apiRequest(endpoint, { method });
                if (!response) return;

                if (!response.ok) {
                    const data = await response.json();
                    throw new Error(data.error || 'Error al realizar la acción');
                }

                alert('✅ ' + successMessage);
                loadServers(); // Recargar lista

            } catch (error) {
                alert('❌ Error: ' + error.message);
                console.error(error);
            }
        }

        // ============================================================
        // CERRAR SESIÓN
        // ============================================================

        function logout() {
            localStorage.removeItem('waevohosting_token');
            localStorage.removeItem('waevohosting_user');
            window.location.href = '/login.html';
        }

        // ============================================================
        // INICIALIZAR
        // ============================================================

        document.addEventListener('DOMContentLoaded', loadServers);
    </script>
</body>
</html>
