<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WaevoHosting - Panel de Control</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0b0e14;
            color: #e0e5ee;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: radial-gradient(ellipse at 50% 0%, #1a1f2e 0%, #0b0e14 70%);
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 2rem;
            margin: 1rem;
        }

        .login-card {
            background: rgba(18, 24, 38, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(100, 120, 200, 0.15);
            border-radius: 2rem;
            padding: 2.5rem 2rem;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
        }

        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo h1 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #a78bfa, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .logo p {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-top: 0.3rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 0.4rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.8rem 1.2rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(100, 120, 200, 0.2);
            border-radius: 0.8rem;
            color: #e0e5ee;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #7c6cf0;
            box-shadow: 0 0 0 3px rgba(124, 108, 240, 0.2);
        }

        .btn-login {
            width: 100%;
            padding: 0.9rem;
            background: linear-gradient(135deg, #7c6cf0, #5b4ad0);
            border: none;
            border-radius: 0.8rem;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(124, 108, 240, 0.3);
        }

        .btn-login:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 25px rgba(124, 108, 240, 0.4);
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 0.6rem;
            padding: 0.8rem;
            color: #f87171;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.75rem;
            color: #475569;
        }

        .footer a {
            color: #7c6cf0;
            text-decoration: none;
        }

        .loading-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .btn-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo">
                <h1>WaevoHosting</h1>
                <p>Panel de control</p>
            </div>

            <div class="error-message" id="errorMessage"></div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" placeholder="tu@email.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-login" id="loginBtn">
                    <span class="btn-content">
                        <span id="btnText">Iniciar sesión</span>
                        <span class="loading-spinner" id="loadingSpinner"></span>
                    </span>
                </button>
            </form>

            <div class="footer">
                <p>¿No tienes cuenta? <a href="#" onclick="alert('Las cuentas se crean desde el panel de administración de Pterodactyl. Contacta con soporte.')">Solicita acceso</a></p>
            </div>
        </div>
    </div>

    <script>
        async function handleLogin(event) {
            event.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorMessage = document.getElementById('errorMessage');
            const loginBtn = document.getElementById('loginBtn');
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('loadingSpinner');

            // Resetear errores
            errorMessage.classList.remove('show');
            errorMessage.textContent = '';

            // Validar campos
            if (!email || !password) {
                errorMessage.textContent = 'Por favor, rellena todos los campos.';
                errorMessage.classList.add('show');
                return;
            }

            // Mostrar estado de carga
            loginBtn.disabled = true;
            btnText.textContent = 'Iniciando sesión...';
            spinner.style.display = 'block';

            try {
                // Llamada al endpoint de login
                const response = await fetch('/api/auth', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Error al iniciar sesión');
                }

                // Guardar token y datos del usuario
                localStorage.setItem('waevohosting_token', data.token);
                localStorage.setItem('waevohosting_user', JSON.stringify(data.user));

                // Redirigir al dashboard
                window.location.href = '/dashboard.html';

            } catch (error) {
                errorMessage.textContent = error.message || 'Credenciales incorrectas. Intenta de nuevo.';
                errorMessage.classList.add('show');
            } finally {
                // Restaurar estado del botón
                loginBtn.disabled = false;
                btnText.textContent = 'Iniciar sesión';
                spinner.style.display = 'none';
            }
        }

        // Si el usuario ya tiene sesión, redirigir al dashboard
        const token = localStorage.getItem('waevohosting_token');
        if (token) {
            window.location.href = '/dashboard.html';
        }
    </script>
</body>
</html>
