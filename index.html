<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WaevoHosting</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0b0e1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      padding: 1.5rem;
    }
    .card {
      background: #141b2b;
      max-width: 700px;
      width: 100%;
      padding: 3rem 2.5rem;
      border-radius: 2rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
      border: 1px solid #2a3550;
      text-align: center;
    }
    .logo {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #a78bfa, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
    }
    .badge {
      display: inline-block;
      background: #1e2a44;
      color: #94a3b8;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.3rem 1rem;
      border-radius: 999px;
      letter-spacing: 0.02em;
      border: 1px solid #2a3550;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: 1.8rem;
      font-weight: 600;
      color: #f1f5f9;
      margin-bottom: 0.75rem;
    }
    p {
      color: #94a3b8;
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .loader {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.6rem;
      margin: 1.5rem 0;
    }
    .dot {
      width: 12px;
      height: 12px;
      background: #60a5fa;
      border-radius: 50%;
      animation: pulse 1.2s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; background: #a78bfa; }
    .dot:nth-child(3) { animation-delay: 0.4s; background: #f472b6; }
    @keyframes pulse {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }
    .footer {
      margin-top: 2rem;
      font-size: 0.85rem;
      color: #475569;
      border-top: 1px solid #1e2a44;
      padding-top: 1.5rem;
    }
    .footer span {
      color: #60a5fa;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">WaevoHosting</div>
    <div class="badge">🚧 EN CONSTRUCCIÓN</div>
    <h1>Estamos creando algo increíble</h1>
    <p>
      Nuestra plataforma está siendo preparada para ofrecerte el mejor
      <strong>web hosting</strong> y <strong>bot hosting</strong>.
      Vuelve pronto.
    </p>
    <div class="loader">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
    <div class="footer">
      <span>waevohosting.es</span> · 2026
    </div>
  </div>
</body>
</html>
