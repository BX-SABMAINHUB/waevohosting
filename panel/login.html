<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WaevoHosting · Iniciar sesión</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0b0e14;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background-image: radial-gradient(ellipse at 50% 0%, #1a1f2e 0%, #0b0e14 70%);
        }
        .login-card {
            background: rgba(18, 24, 38, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(100, 120, 200, 0.12);
            border-radius: 2rem;
            padding: 2.8rem 2.5rem;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(100, 120, 200, 0.05);
        }
        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        .logo h1 {
            font-size: 2rem;
            font-weight: 800;
            color: #e0e5ee;
            letter-spacing: -0.03em;
        }
        .logo h1 span {
            background: linear-gradient(135deg, #a78bfa, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo p {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-top: 0.25rem;
            font-weight: 400;
        }
        .form-group {
            margin-bottom: 1.2rem;
        }
        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-bottom: 0.4rem;
        }
        .form-group input {
            width: 100%;
            padding: 0.8rem 1.2rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(100, 120, 200, 0.15);
            border-radius: 0.8rem;
            color: #e0e5ee;
            font-size: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #7c6cf0;
            box-shadow: 0 0 0 3px rgba(124, 108, 240, 0.12);
        }
        .form-group input::placeholder {
            color: #475569;
        }
        .btn-login {
            width: 100%;
            padding: 0.85rem;
            background: linear-gradient(135deg, #7c6cf0, #5b4ad0);
            border: none;
            border-radius: 0.8rem;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(124, 108, 240, 0.25);
            margin-top: 0.25rem;
        }
        .btn-login:hover {
            transform: scale(1.01);
            box-shadow: 0 6px 25px rgba(124, 108, 240, 0.35);
        }
        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .btn-google {
            width: 100%;
            padding: 0.75rem 1rem;
            background: #0d1117;
            border: 1px solid #2d3548;
            border-radius: 0.8rem;
            color: #e0e5ee;
            font-weight: 500;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            transition: background 0.2s, border-color 0.2s, transform 0.15s;
            margin-top: 1rem;
        }
        .btn-google:hover {
            background: #1a1f2e;
            border-color: #7c6cf0;
            transform: scale(1.01);
        }
        .btn-google:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .btn-google svg {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
        }
        .divider {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 1.5rem 0;
            color: #475569;
            font-size: 0.8rem;
        }
        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            border-top: 1px solid #2d3548;
        }
        .error-msg {
            color: #f87171;
            font-size: 0.85rem;
            text-align: center;
            margin-top: 0.8rem;
            min-height: 1.5rem;
            word-break: break-word;
        }
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-top: 2px solid #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 0.5rem;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .hidden {
            display: none !important;
        }
        .footer {
            display: flex;
            justify-content: space-between;
            margin-top: 1.5rem;
            font-size: 0.85rem;
        }
        .footer a {
            color: #94a3b8;
            text-decoration: none;
            transition: color 0.2s;
        }
        .footer a:hover {
            color: #a78bfa;
        }
        .copyright {
            text-align: center;
            margin-top: 1.8rem;
            font-size: 0.7rem;
            color: #475569;
            border-top: 1px solid #2d3548;
            padding-top: 1.2rem;
            letter-spacing: 0.2px;
        }
        .copyright span {
            color: #7c6cf0;
            font-weight: 600;
        }
        @media (max-width: 480px) {
            .login-card {
                padding: 2rem 1.5rem;
            }
            .footer {
                flex-direction: column;
                align-items: center;
                gap: 0.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo">
            <h1>Waevo<span>Hosting</span></h1>
            <p>Panel de control</p>
        </div>

        <!-- ===== FORMULARIO TRADICIONAL ===== -->
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" placeholder="tu@email.com" required autofocus />
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required />
            </div>
            <button type="submit" class="btn-login" id="loginBtn">
                <span id="btnText">Iniciar sesión</span>
                <span id="btnSpinner" class="spinner hidden"></span>
            </button>
            <div class="error-msg" id="errorMsg"></div>
        </form>

        <div class="divider">O continúa con</div>

        <!-- ===== BOTÓN GOOGLE ===== -->
        <button id="googleLoginBtn" class="btn-google">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="22" height="22">
                <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z" />
                <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z" />
                <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z" />
                <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z" />
            </svg>
            Iniciar sesión con Google
        </button>

        <div class="footer">
            <a href="#" id="forgotLink">¿Olvidaste tu contraseña?</a>
            <a href="#" id="registerLink">Registrarse</a>
        </div>
        <div class="copyright">
            <span>Waevo</span> Hosting · 2026
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- SCRIPTS: Firebase CDN (siempre funciona) + LOG -->
    <!-- ============================================================ -->
    <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>

    <script>
        console.log('✅ Script cargado correctamente');

        // ============================================================
        // 1. CONFIGURACIÓN DE FIREBASE
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyD13N4-9MjTrmlPwGP7mves0Exje4v2ACw",
            authDomain: "kahoot-8529e.firebaseapp.com",
            databaseURL: "https://kahoot-8529e-default-rtdb.firebaseio.com",
            projectId: "kahoot-8529e",
            storageBucket: "kahoot-8529e.firebasestorage.app",
            messagingSenderId: "313414356056",
            appId: "1:313414356056:web:4aab4587f7df9393008e2d",
            measurementId: "G-8T4CPC1BQ3"
        };

        // Inicializar Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const provider = new firebase.auth.GoogleAuthProvider();
        console.log('✅ Firebase inicializado');

        // ============================================================
        // 2. REFERENCIAS AL DOM
        // ============================================================
        const googleBtn = document.getElementById('googleLoginBtn');
        console.log('🔘 Botón encontrado:', googleBtn);

        // ============================================================
        // 3. LOGIN CON GOOGLE (FIREBASE)
        // ============================================================
        if (googleBtn) {
            googleBtn.addEventListener('click', function(e) {
                console.log('🖱️ Click en el botón de Google detectado!');
                e.preventDefault();

                // Deshabilitar el botón y mostrar spinner
                googleBtn.disabled = true;
                googleBtn.innerHTML = `
                    <span class="spinner" style="display:inline-block;width:18px;height:18px;border:2px solid rgba(255,255,255,0.2);border-top:2px solid #fff;border-radius:50%;animation:spin 0.8s linear infinite;vertical-align:middle;margin-right:0.5rem;"></span>
                    Conectando con Google...
                `;

                // Iniciar sesión con Google
                auth.signInWithPopup(provider)
                    .then(async (result) => {
                        console.log('✅ Google login exitoso:', result.user.email);
                        const user = result.user;
                        const idToken = await user.getIdToken();

                        // Enviar el token a tu backend de Vercel
                        return fetch('/api/firebase-auth', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ token: idToken }),
                        });
                    })
                    .then(async (response) => {
                        const data = await response.json();
                        console.log('📦 Respuesta del backend:', data);

                        if (response.ok && data.success) {
                            localStorage.setItem('waevohosting_token', data.token);
                            localStorage.setItem('waevohosting_user', JSON.stringify(data.user));
                            window.location.href = '/dashboard.html';
                        } else {
                            document.getElementById('errorMsg').textContent = data.error || 'Error al autenticar con Google.';
                            console.error('Error backend:', data);
                        }
                    })
                    .catch((error) => {
                        console.error('❌ Error en Google Login:', error);
                        const errorMsg = document.getElementById('errorMsg');
                        if (error.code === 'auth/unauthorized-domain') {
                            errorMsg.textContent = '⚠️ Dominio no autorizado. Añade "panel.waevohosting.es" en Firebase Console.';
                        } else {
                            errorMsg.textContent = 'Error al iniciar sesión con Google: ' + (error.message || 'Revisa la consola.');
                        }
                    })
                    .finally(() => {
                        // Restaurar el botón
                        googleBtn.disabled = false;
                        googleBtn.innerHTML = `
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="22" height="22">
                                <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z" />
                                <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z" />
                                <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z" />
                                <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z" />
                            </svg>
                            Iniciar sesión con Google
                        `;
                    });
            });
        } else {
            console.error('❌ No se encontró el botón de Google');
        }
    </script>

</body>
</html>
