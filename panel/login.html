<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WaevoHosting · Panel de Administración</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0b0e14;
            color: #e0e5ee;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: radial-gradient(ellipse at 50% 0%, #141b2b, #0b0e14 70%);
        }
        .login-container { width: 100%; max-width: 420px; padding: 2rem; }
        .login-card {
            background: rgba(18, 24, 38, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(100, 120, 200, 0.15);
            border-radius: 2rem;
            padding: 2.5rem 2rem;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
        }
        .logo-container { text-align: center; margin-bottom: 2rem; }
        .logo-container h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #a78bfa, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo-container p { color: #94a3b8; font-size: 0.9rem; margin-top: 0.3rem; }
        .form-group { margin-bottom: 1.5rem; }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 0.4rem;
        }
        .form-group input {
            width: 100%;
            padding: 0.8rem 1.2rem;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(100, 120, 200, 0.2);
            border-radius: 0.8rem;
            color: #e0e5ee;
            font-size: 1rem;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #7c6cf0;
            box-shadow: 0 0 0 3px rgba(124, 108, 240, 0.2);
        }
        .btn-login {
            width: 100%;
            padding: 0.9rem;
            background: linear-gradient(135deg, #7c6cf0, #5b4ad0);
            border: none;
            border-radius: 0.8rem;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(124, 108, 240, 0.3);
        }
        .btn-login:hover { transform: scale(1.02); box-shadow: 0 6px 25px rgba(124, 108, 240, 0.4); }
        .btn-login:active { transform: scale(0.98); }
        .footer { text-align: center; margin-top: 1.5rem; font-size: 0.75rem; color: #475569; }
        .footer a { color: #7c6cf0; text-decoration: none; }
        .error-msg {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            padding: 0.8rem;
            border-radius: 0.6rem;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
        .error-msg.show { display: block; }
        .loading-spinner {
            display: none;
            text-align: center;
            margin: 1rem 0;
        }
        .loading-spinner.show { display: block; }
        .spinner {
            border: 3px solid rgba(124, 108, 240, 0.1);
            border-top: 3px solid #7c6cf0;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo-container">
                <h1>WaevoHosting</h1>
                <p>Panel de administración</p>
            </div>
            <div id="errorMsg" class="error-msg">❌ Credenciales incorrectas. Inténtalo de nuevo.</div>
            <div class="loading-spinner" id="loadingSpinner"><div class="spinner"></div></div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" placeholder="admin@waevohosting.es" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-login" id="loginBtn">Iniciar sesión</button>
            </form>
            <div class="footer">
                <p>¿No tienes cuenta? <a href="#" onclick="alert('Contacta con el administrador de WaevoHosting')">Solicita acceso</a></p>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            const loadingSpinner = document.getElementById('loadingSpinner');
            const loginBtn = document.getElementById('loginBtn');
            
            // Resetear mensajes
            errorMsg.classList.remove('show');
            loadingSpinner.classList.remove('show');

            if (!email || !password) {
                errorMsg.textContent = '❌ Por favor, rellena todos los campos.';
                errorMsg.classList.add('show');
                return;
            }

            // Mostrar carga
            loadingSpinner.classList.add('show');
            loginBtn.disabled = true;
            loginBtn.textContent = 'Verificando...';

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();

                if (data.success) {
                    localStorage.setItem('waevohosting_token', data.token);
                    localStorage.setItem('waevohosting_user', JSON.stringify(data.user));
                    window.location.href = '/dashboard.html';
                } else {
                    errorMsg.textContent = data.error || '❌ Credenciales incorrectas.';
                    errorMsg.classList.add('show');
                }
            } catch (error) {
                errorMsg.textContent = '❌ Error de conexión con el servidor.';
                errorMsg.classList.add('show');
                console.error('Error:', error);
            } finally {
                loadingSpinner.classList.remove('show');
                loginBtn.disabled = false;
                loginBtn.textContent = 'Iniciar sesión';
            }
        });
    </script>
</body>
</html>
