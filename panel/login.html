<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waevo · Login</title>
    <style>
        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #12161c;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background-image: radial-gradient(ellipse at 50% 0%, #1a1f2e 0%, #12161c 70%);
        }

        /* ===== TARJETA DE LOGIN ===== */
        .login-card {
            background: #1a1f2e;
            border-radius: 0.75rem;
            padding: 2.5rem 2.2rem;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        /* ===== LOGO ===== */
        .logo {
            text-align: center;
            margin-bottom: 1.8rem;
        }
        .logo h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #e0e5ee;
            letter-spacing: -0.5px;
        }
        .logo h1 span {
            background: linear-gradient(135deg, #a78bfa, #7c6cf0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo p {
            color: #64748b;
            font-size: 0.85rem;
            margin-top: 0.2rem;
            font-weight: 500;
        }

        /* ===== FORMULARIO ===== */
        .form-group {
            margin-bottom: 1.2rem;
        }
        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-bottom: 0.4rem;
        }
        .form-group input {
            width: 100%;
            padding: 0.7rem 1rem;
            background: #0d1117;
            border: 1px solid #2d3548;
            border-radius: 0.4rem;
            color: #e0e5ee;
            font-size: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #7c6cf0;
            box-shadow: 0 0 0 3px rgba(124, 108, 240, 0.15);
        }
        .form-group input::placeholder {
            color: #475569;
        }

        /* ===== BOTÓN ===== */
        .btn-login {
            width: 100%;
            padding: 0.75rem;
            background: linear-gradient(135deg, #7c6cf0, #5b4ad0);
            border: none;
            border-radius: 0.4rem;
            color: white;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(124, 108, 240, 0.25);
            margin-top: 0.3rem;
        }
        .btn-login:hover {
            transform: scale(1.01);
            box-shadow: 0 6px 25px rgba(124, 108, 240, 0.35);
        }
        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* ===== FOOTER ===== */
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1.2rem;
            font-size: 0.8rem;
        }
        .footer a {
            color: #94a3b8;
            text-decoration: none;
            transition: color 0.2s;
        }
        .footer a:hover {
            color: #a78bfa;
        }

        /* ===== COPYRIGHT ===== */
        .copyright {
            text-align: center;
            margin-top: 1.8rem;
            font-size: 0.7rem;
            color: #475569;
            border-top: 1px solid #2d3548;
            padding-top: 1.2rem;
            letter-spacing: 0.2px;
        }
        .copyright span {
            color: #7c6cf0;
            font-weight: 600;
        }

        /* ===== ERROR ===== */
        .error-msg {
            color: #f87171;
            font-size: 0.85rem;
            text-align: center;
            margin-top: 0.8rem;
            min-height: 1.5rem;
        }

        /* ===== SPINNER ===== */
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.2);
            border-top: 2px solid #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 0.5rem;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .hidden {
            display: none;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .login-card {
                padding: 1.8rem 1.2rem;
            }
            .footer {
                flex-direction: column;
                gap: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <!-- Logo -->
        <div class="logo">
            <h1>Waevo<span>Hosting</span></h1>
            <p>Panel de control</p>
        </div>

        <!-- Formulario -->
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" placeholder="tu@email.com" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">
                <span id="btnText">Iniciar sesión</span>
                <span id="btnSpinner" class="spinner hidden"></span>
            </button>

            <div class="error-msg" id="errorMsg"></div>
        </form>

        <!-- Footer -->
        <div class="footer">
            <a href="#" id="forgotLink">¿Olvidaste tu contraseña?</a>
            <a href="#" id="registerLink">Registrarse</a>
        </div>

        <!-- Copyright -->
        <div class="copyright">
            <span>Waevo</span> Hosting · 2026
        </div>
    </div>

    <script>
        // ============================================================
        // REFERENCIAS
        // ============================================================
        const form = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');
        const errorMsg = document.getElementById('errorMsg');
        const forgotLink = document.getElementById('forgotLink');
        const registerLink = document.getElementById('registerLink');

        // ============================================================
        // REDIRIGIR SI YA ESTÁ LOGUEADO
        // ============================================================
        if (localStorage.getItem('waevohosting_token')) {
            window.location.href = '/dashboard.html';
        }

        // ============================================================
        // ENVÍO DEL FORMULARIO
        // ============================================================
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                errorMsg.textContent = 'Debes completar todos los campos.';
                return;
            }

            // Deshabilitar botón y mostrar spinner
            loginBtn.disabled = true;
            btnText.textContent = 'Verificando...';
            btnSpinner.classList.remove('hidden');
            errorMsg.textContent = '';

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    // Guardar token y datos del usuario
                    localStorage.setItem('waevohosting_token', data.token);
                    localStorage.setItem('waevohosting_user', JSON.stringify(data.user));

                    // Redirigir al dashboard
                    window.location.href = '/dashboard.html';
                } else {
                    errorMsg.textContent = data.error || 'Credenciales incorrectas. Inténtalo de nuevo.';
                }
            } catch (error) {
                console.error('Error en login:', error);
                errorMsg.textContent = 'Error de conexión con el servidor. Inténtalo de nuevo.';
            } finally {
                loginBtn.disabled = false;
                btnText.textContent = 'Iniciar sesión';
                btnSpinner.classList.add('hidden');
            }
        });

        // ============================================================
        // ENTER PARA ENVIAR
        // ============================================================
        passwordInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                form.dispatchEvent(new Event('submit'));
            }
        });

        // ============================================================
        // ENLACES (por ahora solo alertas)
        // ============================================================
        forgotLink.addEventListener('click', (e) => {
            e.preventDefault();
            alert('🔐 Funcionalidad de restablecimiento de contraseña próximamente.');
        });

        registerLink.addEventListener('click', (e) => {
            e.preventDefault();
            alert('📝 El registro de usuarios se gestiona desde el panel de administración de Pterodactyl.');
        });
    </script>
</body>
</html>
