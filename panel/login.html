<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WaevoHosting · Iniciar sesión</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0b0e14;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            background-image: radial-gradient(ellipse at 50% 0%, #1a1f2e 0%, #0b0e14 70%);
        }
        .login-container {
            background: rgba(18, 24, 38, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(100, 120, 200, 0.15);
            border-radius: 2rem;
            padding: 2.5rem 2rem;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
        }
        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        .logo h1 {
            font-size: 2rem;
            font-weight: 800;
            color: #e0e5ee;
            letter-spacing: -0.02em;
        }
        .logo h1 span {
            background: linear-gradient(135deg, #a78bfa, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo p {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-top: 0.3rem;
        }
        .form-group {
            margin-bottom: 1.2rem;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 0.4rem;
        }
        .form-group input {
            width: 100%;
            padding: 0.8rem 1.2rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(100, 120, 200, 0.2);
            border-radius: 0.8rem;
            color: #e0e5ee;
            font-size: 1rem;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #7c6cf0;
            box-shadow: 0 0 0 3px rgba(124, 108, 240, 0.2);
        }
        .btn-login {
            width: 100%;
            padding: 0.9rem;
            background: linear-gradient(135deg, #7c6cf0, #5b4ad0);
            border: none;
            border-radius: 0.8rem;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(124, 108, 240, 0.3);
            margin-top: 0.5rem;
        }
        .btn-login:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 25px rgba(124, 108, 240, 0.4);
        }
        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .error-msg {
            color: #f87171;
            font-size: 0.85rem;
            text-align: center;
            margin-top: 0.8rem;
            min-height: 1.5rem;
        }
        .footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.75rem;
            color: #475569;
        }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-top: 2px solid #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 0.5rem;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>Waevo<span>Hosting</span></h1>
            <p>Panel de administración</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" placeholder="tu@email.com" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-login" id="loginBtn">
                <span id="btnText">Iniciar sesión</span>
                <span id="btnSpinner" class="spinner hidden"></span>
            </button>
            <div class="error-msg" id="errorMsg"></div>
        </form>

        <div class="footer">
            <p>¿No tienes cuenta? <a href="#" style="color:#7c6cf0;text-decoration:none;">Solicita acceso</a></p>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');
        const errorMsg = document.getElementById('errorMsg');

        // Si el usuario ya tiene token, redirigir al dashboard
        if (localStorage.getItem('waevohosting_token')) {
            window.location.href = '/dashboard.html';
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            // Validar campos
            if (!email || !password) {
                errorMsg.textContent = 'Por favor, rellena todos los campos.';
                return;
            }

            // Deshabilitar botón y mostrar spinner
            loginBtn.disabled = true;
            btnText.textContent = 'Verificando...';
            btnSpinner.classList.remove('hidden');
            errorMsg.textContent = '';

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    // Guardar token y datos del usuario
                    localStorage.setItem('waevohosting_token', data.token);
                    localStorage.setItem('waevohosting_user', JSON.stringify(data.user));

                    // Redirigir al dashboard
                    window.location.href = '/dashboard.html';
                } else {
                    errorMsg.textContent = data.error || 'Error al iniciar sesión. Verifica tus credenciales.';
                }
            } catch (error) {
                console.error('Error en login:', error);
                errorMsg.textContent = 'Error de conexión con el servidor. Inténtalo de nuevo.';
            } finally {
                // Rehabilitar botón
                loginBtn.disabled = false;
                btnText.textContent = 'Iniciar sesión';
                btnSpinner.classList.add('hidden');
            }
        });

        // Permitir enviar con Enter
        passwordInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                loginForm.dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
