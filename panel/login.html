<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - WaevoHosting</title>
    
    <!-- Configuración del Import Map para Firebase -->
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js"
            }
        }
    </script>

    <style>
        /* Variables y Reset */
        :root {
            --bg-body: #0f172a; /* Azul oscuro estilo Pterodactyl */
            --bg-panel: #1e293b;
            --bg-input: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #8b5cf6; /* Morado */
            --secondary: #3b82f6; /* Azul */
            --error: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1rem;
        }

        /* Panel de Login */
        .login-container {
            background-color: var(--bg-panel);
            width: 100%;
            max-width: 420px;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        /* Logo */
        .logo {
            text-align: center;
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 2rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Formulario Tradicional */
        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            background-color: var(--bg-input);
            border: 1px solid transparent;
            border-radius: 6px;
            color: var(--text-main);
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn {
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            margin-top: 1rem;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        /* Divisor */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 2rem 0;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--bg-input);
        }

        .divider:not(:empty)::before {
            margin-right: .5em;
        }

        .divider:not(:empty)::after {
            margin-left: .5em;
        }

        /* Botón de Google */
        .btn-google {
            background-color: var(--bg-body);
            color: var(--text-main);
            border: 1px solid var(--bg-input);
        }

        .btn-google:hover:not(:disabled) {
            background-color: #1a2333;
        }

        /* Spinner (Oculto por defecto) */
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Mensajes de Alerta */
        .alert {
            display: none;
            padding: 0.75rem;
            border-radius: 6px;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            text-align: center;
        }

        .alert-error {
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--error);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        
        .alert-success {
            background-color: rgba(34, 197, 94, 0.1);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h1 class="logo">WaevoHosting</h1>
        
        <div id="alertMessage" class="alert"></div>

        <form id="traditionalLoginForm" onsubmit="event.preventDefault();">
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" placeholder="tu@email.com" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary">Iniciar sesión</button>
        </form>

        <div class="divider">O continúa con</div>

        <button type="button" id="btnGoogle" class="btn btn-google">
            <!-- Icono SVG de Google -->
            <svg id="googleIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 48 48">
                <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/>
                <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>
                <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>
                <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/>
            </svg>
            <div id="googleSpinner" class="spinner"></div>
            <span id="googleText">Iniciar sesión con Google</span>
        </button>
    </div>

    <!-- Script Modular de Firebase -->
    <script type="module">
        import { initializeApp } from 'firebase/app';
        import { getAuth, signInWithPopup, GoogleAuthProvider } from 'firebase/auth';

        // 1. Configuración de Firebase (proporcionada por ti)
        const firebaseConfig = {
            apiKey: "AIzaSyD13N4-9MjTrmlPwGP7mves0Exje4v2ACw",
            authDomain: "kahoot-8529e.firebaseapp.com",
            databaseURL: "https://kahoot-8529e-default-rtdb.firebaseio.com",
            projectId: "kahoot-8529e",
            storageBucket: "kahoot-8529e.firebasestorage.app",
            messagingSenderId: "313414356056",
            appId: "1:313414356056:web:4aab4587f7df9393008e2d",
            measurementId: "G-8T4CPC1BQ3"
        };

        // 2. Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // 3. Referencias del DOM
        const btnGoogle = document.getElementById('btnGoogle');
        const googleIcon = document.getElementById('googleIcon');
        const googleSpinner = document.getElementById('googleSpinner');
        const googleText = document.getElementById('googleText');
        const alertMessage = document.getElementById('alertMessage');

        // Función para mostrar mensajes
        function showAlert(msg, isSuccess = false) {
            alertMessage.style.display = 'block';
            alertMessage.textContent = msg;
            alertMessage.className = isSuccess ? 'alert alert-success' : 'alert alert-error';
        }

        function hideAlert() {
            alertMessage.style.display = 'none';
        }

        // 4. Lógica del Botón de Google (CRÍTICA)
        btnGoogle.addEventListener('click', async () => {
            hideAlert();

            // Estado de Carga
            btnGoogle.disabled = true;
            googleIcon.style.display = 'none';
            googleSpinner.style.display = 'block';
            googleText.textContent = 'Procesando...';

            try {
                // REQUISITO CRÍTICO: Esperar 5 segundos exactos ANTES de abrir la ventana de Google
                await new Promise(resolve => setTimeout(resolve, 5000));

                googleText.textContent = 'Esperando a Google...';

                // Abrir Popup de Google OAuth
                const result = await signInWithPopup(auth, provider);
                
                googleText.textContent = 'Autenticando...';

                // Obtener el Token de Firebase
                const idToken = await result.user.getIdToken();

                // Enviar al Backend (Método POST)
                const response = await fetch('/api/firebase-auth', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ token: idToken })
                });

                if (response.ok) {
                    showAlert('Inicio de sesión exitoso. Redirigiendo...', true);
                    // Redirigir si la respuesta es exitosa
                    window.location.href = '/dashboard.html';
                } else {
                    throw new Error('El backend rechazó la autenticación.');
                }

            } catch (error) {
                // Manejo de errores comunes de Firebase
                console.error("Error durante autenticación: ", error);
                
                let errorMsg = 'Ocurrió un error inesperado al iniciar sesión.';
                
                if (error.code === 'auth/popup-closed-by-user') {
                    errorMsg = 'Cancelaste el inicio de sesión con Google.';
                } else if (error.code === 'auth/unauthorized-domain') {
                    errorMsg = 'Este dominio no está autorizado en la consola de Firebase.';
                } else if (error.code === 'auth/network-request-failed') {
                    errorMsg = 'Error de red. Revisa tu conexión a internet.';
                } else if (error.message) {
                    errorMsg = error.message; // Mensaje genérico del throw new Error o fetch
                }

                showAlert(errorMsg);

            } finally {
                // Restaurar estado del botón
                btnGoogle.disabled = false;
                googleIcon.style.display = 'block';
                googleSpinner.style.display = 'none';
                googleText.textContent = 'Iniciar sesión con Google';
            }
        });
    </script>
</body>
</html>
