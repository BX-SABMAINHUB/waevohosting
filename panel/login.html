<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WaevoHosting · Iniciar sesión</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />
    <style>
        /* ===== RESET Y BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0b0e14;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background-image: radial-gradient(ellipse at 50% 0%, #1a1f2e 0%, #0b0e14 70%);
        }
        .login-card {
            background: rgba(18, 24, 38, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(100, 120, 200, 0.12);
            border-radius: 2rem;
            padding: 2.8rem 2.5rem;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(100, 120, 200, 0.05);
        }
        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        .logo h1 {
            font-size: 2rem;
            font-weight: 800;
            color: #e0e5ee;
            letter-spacing: -0.03em;
        }
        .logo h1 span {
            background: linear-gradient(135deg, #a78bfa, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .logo p {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-top: 0.25rem;
            font-weight: 400;
        }
        .form-group {
            margin-bottom: 1.2rem;
        }
        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-bottom: 0.4rem;
        }
        .form-group input {
            width: 100%;
            padding: 0.8rem 1.2rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(100, 120, 200, 0.15);
            border-radius: 0.8rem;
            color: #e0e5ee;
            font-size: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #7c6cf0;
            box-shadow: 0 0 0 3px rgba(124, 108, 240, 0.12);
        }
        .form-group input::placeholder {
            color: #475569;
        }
        .btn-login {
            width: 100%;
            padding: 0.85rem;
            background: linear-gradient(135deg, #7c6cf0, #5b4ad0);
            border: none;
            border-radius: 0.8rem;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(124, 108, 240, 0.25);
            margin-top: 0.25rem;
        }
        .btn-login:hover {
            transform: scale(1.01);
            box-shadow: 0 6px 25px rgba(124, 108, 240, 0.35);
        }
        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .error-msg {
            color: #f87171;
            font-size: 0.85rem;
            text-align: center;
            margin-top: 0.8rem;
            min-height: 1.5rem;
            word-break: break-word;
        }
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-top: 2px solid #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 0.5rem;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .hidden {
            display: none !important;
        }
        .footer {
            display: flex;
            justify-content: space-between;
            margin-top: 1.5rem;
            font-size: 0.85rem;
        }
        .footer a {
            color: #94a3b8;
            text-decoration: none;
            transition: color 0.2s;
        }
        .footer a:hover {
            color: #a78bfa;
        }
        .copyright {
            text-align: center;
            margin-top: 1.8rem;
            font-size: 0.7rem;
            color: #475569;
            border-top: 1px solid #2d3548;
            padding-top: 1.2rem;
            letter-spacing: 0.2px;
        }
        .copyright span {
            color: #7c6cf0;
            font-weight: 600;
        }
        @media (max-width: 480px) {
            .login-card {
                padding: 2rem 1.5rem;
            }
            .footer {
                flex-direction: column;
                align-items: center;
                gap: 0.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo">
            <h1>Waevo<span>Hosting</span></h1>
            <p>Panel de control</p>
        </div>

        <!-- ===== FORMULARIO DE LOGIN (FIREBASE) ===== -->
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" placeholder="tu@email.com" required autofocus />
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required />
            </div>
            <button type="submit" class="btn-login" id="loginBtn">
                <span id="btnText">Iniciar sesión</span>
                <span id="btnSpinner" class="spinner hidden"></span>
            </button>
            <div class="error-msg" id="errorMsg"></div>
        </form>

        <div class="footer">
            <a href="#" id="forgotLink">¿Olvidaste tu contraseña?</a>
            <a href="#" id="registerLink">Registrarse</a>
        </div>
        <div class="copyright">
            <span>Waevo</span> Hosting · 2026
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- SCRIPTS: FIREBASE (email + contraseña)                       -->
    <!-- ============================================================ -->
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js",
                "firebase/analytics": "https://www.gstatic.com/firebasejs/10.13.1/firebase-analytics.js"
            }
        }
    </script>

    <script type="module">
        // ============================================================
        // 1. IMPORTAR FIREBASE
        // ============================================================
        import { initializeApp } from 'firebase/app';
        import { getAuth, signInWithEmailAndPassword } from 'firebase/auth';
        import { getAnalytics } from 'firebase/analytics';

        console.log('✅ Firebase modular cargado');

        // ============================================================
        // 2. CONFIGURACIÓN DE FIREBASE
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyD13N4-9MjTrmlPwGP7mves0Exje4v2ACw",
            authDomain: "kahoot-8529e.firebaseapp.com",
            databaseURL: "https://kahoot-8529e-default-rtdb.firebaseio.com",
            projectId: "kahoot-8529e",
            storageBucket: "kahoot-8529e.firebasestorage.app",
            messagingSenderId: "313414356056",
            appId: "1:313414356056:web:4aab4587f7df9393008e2d",
            measurementId: "G-8T4CPC1BQ3"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const analytics = getAnalytics(app);

        console.log('✅ Firebase inicializado');

        // ============================================================
        // 3. REFERENCIAS AL DOM
        // ============================================================
        const form = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');
        const errorMsg = document.getElementById('errorMsg');
        const forgotLink = document.getElementById('forgotLink');
        const registerLink = document.getElementById('registerLink');

        // ============================================================
        // 4. REDIRIGIR SI YA ESTÁ LOGUEADO
        // ============================================================
        if (localStorage.getItem('waevohosting_token')) {
            window.location.href = '/dashboard.html';
        }

        // ============================================================
        // 5. LOGIN CON FIREBASE (email + contraseña)
        // ============================================================
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                errorMsg.textContent = 'Debes completar todos los campos.';
                return;
            }

            // Deshabilitar botón y mostrar spinner
            loginBtn.disabled = true;
            btnText.textContent = 'Verificando...';
            btnSpinner.classList.remove('hidden');
            errorMsg.textContent = '';

            console.log('🔄 Intentando login con Firebase:', email);

            try {
                // ============================================================
                // 5a. Autenticar con Firebase (email/contraseña)
                // ============================================================
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                const idToken = await user.getIdToken();

                console.log('✅ Firebase login exitoso:', user.email);

                // ============================================================
                // 5b. Enviar el token al backend de Vercel
                // ============================================================
                const response = await fetch('/api/firebase-auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: idToken }),
                });

                const data = await response.json();
                console.log('📦 Respuesta del backend:', data);

                if (response.ok && data.success) {
                    localStorage.setItem('waevohosting_token', data.token);
                    localStorage.setItem('waevohosting_user', JSON.stringify(data.user));
                    window.location.href = '/dashboard.html';
                } else {
                    errorMsg.textContent = data.error || 'Error al autenticar con Firebase.';
                    console.error('Error backend:', data);
                }
            } catch (error) {
                console.error('❌ Error en login:', error);

                // Mensajes de error específicos de Firebase
                if (error.code === 'auth/user-not-found') {
                    errorMsg.textContent = '⚠️ Usuario no registrado. Verifica tu correo o regístrate.';
                } else if (error.code === 'auth/wrong-password') {
                    errorMsg.textContent = '⚠️ Contraseña incorrecta. Inténtalo de nuevo.';
                } else if (error.code === 'auth/invalid-email') {
                    errorMsg.textContent = '⚠️ Correo electrónico inválido.';
                } else if (error.code === 'auth/too-many-requests') {
                    errorMsg.textContent = '⚠️ Demasiados intentos. Espera unos minutos.';
                } else {
                    errorMsg.textContent = 'Error al iniciar sesión: ' + (error.message || 'Revisa la consola.');
                }
            } finally {
                // Restaurar botón
                loginBtn.disabled = false;
                btnText.textContent = 'Iniciar sesión';
                btnSpinner.classList.add('hidden');
            }
        });

        // ============================================================
        // 6. ENTER PARA ENVIAR
        // ============================================================
        passwordInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') form.dispatchEvent(new Event('submit'));
        });

        // ============================================================
        // 7. ENLACES
        // ============================================================
        forgotLink.addEventListener('click', (e) => {
            e.preventDefault();
            alert('🔐 Funcionalidad de restablecimiento de contraseña próximamente.');
        });

        registerLink.addEventListener('click', (e) => {
            e.preventDefault();
            alert('📝 El registro de usuarios se gestiona desde Firebase. Contacta con el administrador.');
        });
    </script>

</body>
</html>
