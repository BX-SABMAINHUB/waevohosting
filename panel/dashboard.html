<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WaevoHosting · Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0b0e14;
            color: #e0e5ee;
            min-height: 100vh;
            padding: 1.5rem;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            background: rgba(18, 24, 38, 0.6);
            border-radius: 1.2rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 2rem;
        }
        .header h1 {
            font-size: 1.5rem;
            font-weight: 700;
        }
        .header h1 span {
            background: linear-gradient(135deg, #a78bfa, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .user-info .email {
            color: #94a3b8;
            font-size: 0.9rem;
        }
        .btn-logout {
            background: rgba(255, 255, 255, 0.05);
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.5rem 1.2rem;
            border-radius: 0.8rem;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .btn-logout:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #e0e5ee;
        }
        .card {
            background: rgba(18, 24, 38, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 1.2rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .card h2 {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        .card p {
            color: #94a3b8;
            font-size: 0.95rem;
        }
        .servers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.2rem;
            margin-top: 1rem;
        }
        .server-card {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 1rem;
            padding: 1.2rem;
            transition: border-color 0.2s, transform 0.2s;
        }
        .server-card:hover {
            border-color: rgba(124, 108, 240, 0.3);
            transform: translateY(-2px);
        }
        .server-name {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 0.3rem;
        }
        .server-status {
            display: inline-block;
            padding: 0.2rem 0.8rem;
            border-radius: 999px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            margin: 0.5rem 0;
        }
        .status-running {
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
        }
        .status-offline {
            background: rgba(248, 113, 113, 0.15);
            color: #f87171;
        }
        .status-suspended {
            background: rgba(251, 191, 36, 0.15);
            color: #fbbf24;
        }
        .server-actions {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-top: 0.8rem;
        }
        .server-actions button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            padding: 0.3rem 0.8rem;
            border-radius: 0.5rem;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .server-actions button:hover {
            background: rgba(124, 108, 240, 0.2);
            border-color: rgba(124, 108, 240, 0.4);
            color: #e0e5ee;
        }
        .loading {
            text-align: center;
            color: #94a3b8;
            padding: 3rem 0;
        }
        .error-msg {
            color: #f87171;
            text-align: center;
            padding: 1rem;
        }
        .empty-msg {
            color: #475569;
            text-align: center;
            padding: 2rem 0;
        }
        .badge {
            background: rgba(245, 158, 11, 0.12);
            color: #fbbf24;
            font-size: 0.6rem;
            padding: 0.2rem 0.6rem;
            border-radius: 999px;
            text-transform: uppercase;
            font-weight: 700;
        }
        @media (max-width: 600px) {
            .header {
                flex-direction: column;
                gap: 1rem;
                align-items: stretch;
            }
            .user-info {
                flex-direction: column;
                align-items: stretch;
                gap: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Waevo<span>Hosting</span></h1>
        <div class="user-info">
            <span class="email" id="userEmail">cargando...</span>
            <button class="btn-logout" id="logoutBtn">Cerrar sesión</button>
        </div>
    </div>

    <div class="card">
        <h2>📊 Panel de control</h2>
        <p>Bienvenido a tu panel de administración. Aquí puedes gestionar tus servidores y servicios.</p>
    </div>

    <div id="serversContainer">
        <div class="loading">⏳ Cargando servidores...</div>
    </div>

    <script>
        // ============================================================
        // 1. Verificar autenticación
        // ============================================================
        const token = localStorage.getItem('waevohosting_token');
        const userData = JSON.parse(localStorage.getItem('waevohosting_user') || '{}');

        if (!token) {
            window.location.href = '/login.html';
        }

        // Mostrar email del usuario
        document.getElementById('userEmail').textContent = userData.email || 'Usuario';

        // ============================================================
        // 2. Cargar servidores desde la API
        // ============================================================
        const container = document.getElementById('serversContainer');

        async function loadServers() {
            try {
                const response = await fetch('/api/servers', {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json',
                    }
                });

                if (response.status === 401) {
                    // Token expirado o inválido
                    localStorage.removeItem('waevohosting_token');
                    localStorage.removeItem('waevohosting_user');
                    window.location.href = '/login.html';
                    return;
                }

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Error al obtener servidores');
                }

                const servers = data.data || [];

                if (servers.length === 0) {
                    container.innerHTML = `
                        <div class="card">
                            <div class="empty-msg">
                                🚀 No tienes servidores activos.
                                <br><br>
                                <a href="https://panel.waevohosting.es" style="color:#7c6cf0;">Crear un servidor</a>
                            </div>
                        </div>
                    `;
                    return;
                }

                // Generar tarjetas de servidores
                let html = '<div class="card"><h2>🖥️ Tus servidores</h2><div class="servers-grid">';
                servers.forEach(server => {
                    const statusClass = getStatusClass(server.status);
                    const statusLabel = server.status || 'unknown';
                    html += `
                        <div class="server-card">
                            <div class="server-name">${server.name || server.identifier || 'Sin nombre'}</div>
                            <div class="server-status ${statusClass}">${statusLabel}</div>
                            <div style="font-size:0.8rem;color:#475569;margin-top:0.3rem;">
                                ID: ${server.id} · ${server.allocations?.[0]?.alias || server.allocations?.[0]?.ip || 'N/A'}
                            </div>
                            <div class="server-actions">
                                <button onclick="actionServer(${server.id}, 'suspend')">⏸️ Suspend</button>
                                <button onclick="actionServer(${server.id}, 'unsuspend')">▶️ Reanudar</button>
                                <button onclick="actionServer(${server.id}, 'reinstall')">🔄 Reinstalar</button>
                                <button onclick="actionServer(${server.id}, 'delete')">🗑️ Eliminar</button>
                            </div>
                        </div>
                    `;
                });
                html += '</div></div>';
                container.innerHTML = html;

            } catch (error) {
                console.error('Error:', error);
                container.innerHTML = `
                    <div class="card">
                        <div class="error-msg">❌ ${error.message || 'Error al cargar los servidores'}</div>
                    </div>
                `;
            }
        }

        // ============================================================
        // 3. Función para acciones sobre servidores
        // ============================================================
        window.actionServer = async (serverId, action) => {
            if (!confirm(`¿Estás seguro de que quieres ${action} el servidor ${serverId}?`)) {
                return;
            }

            const btn = event?.target || document.activeElement;
            btn.disabled = true;
            btn.textContent = '...';

            try {
                const response = await fetch(`/api/servers/${serverId}/${action}`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json',
                    }
                });

                const data = await response.json();

                if (response.ok) {
                    alert(`✅ Servidor ${serverId}: ${action} exitoso`);
                    loadServers(); // Recargar lista
                } else {
                    alert(`❌ Error: ${data.error || 'Error al realizar la acción'}`);
                }
            } catch (error) {
                alert(`❌ Error de conexión: ${error.message}`);
            } finally {
                btn.disabled = false;
                btn.textContent = action;
            }
        };

        // ============================================================
        // 4. Función para cerrar sesión
        // ============================================================
        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('waevohosting_token');
            localStorage.removeItem('waevohosting_user');
            window.location.href = '/login.html';
        });

        // ============================================================
        // 5. Helper para estados
        // ============================================================
        function getStatusClass(status) {
            const s = (status || '').toLowerCase();
            if (s === 'running' || s === 'active' || s === 'online') return 'status-running';
            if (s === 'suspended' || s === 'suspending') return 'status-suspended';
            return 'status-offline';
        }

        // ============================================================
        // 6. Iniciar carga
        // ============================================================
        loadServers();
    </script>
</body>
</html>
