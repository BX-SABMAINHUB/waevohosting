<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WaevoHosting · Panel de usuario</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />
    <style>
        /* ===== RESET Y BASE ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #0b0e14;
            color: #e0e5ee;
            min-height: 100vh;
            padding: 1.5rem;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            background: rgba(18, 24, 38, 0.6);
            border-radius: 1.2rem;
            border: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 2rem;
        }
        .logo h1 { font-size: 1.5rem; font-weight: 700; }
        .logo h1 span { background: linear-gradient(135deg, #a78bfa, #60a5fa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .user-info { display: flex; align-items: center; gap: 1rem; }
        .btn-logout { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #94a3b8; padding: 0.5rem 1.2rem; border-radius: 0.8rem; cursor: pointer; }
        .btn-logout:hover { background: rgba(255,255,255,0.1); color: #e0e5ee; }

        .card {
            background: rgba(18, 24, 38, 0.6);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 1.2rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .card h2 { font-size: 1.2rem; font-weight: 600; margin-bottom: 0.5rem; }

        .btn-primary {
            background: linear-gradient(135deg, #7c6cf0, #5b4ad0);
            color: white;
            padding: 0.85rem 2rem;
            border: none;
            border-radius: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(124, 108, 240, 0.25);
        }
        .btn-primary:hover { transform: scale(1.01); box-shadow: 0 6px 25px rgba(124, 108, 240, 0.35); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

        .btn-secondary {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #94a3b8;
            padding: 0.5rem 1rem;
            border-radius: 0.6rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-secondary:hover { background: rgba(255,255,255,0.1); color: #e0e5ee; }

        .server-card {
            background: rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 1rem;
            padding: 1.2rem;
            margin-top: 1rem;
        }
        .server-header { display: flex; justify-content: space-between; align-items: center; }
        .server-name { font-weight: 600; font-size: 1.1rem; }
        .server-status { display: inline-block; padding: 0.2rem 0.8rem; border-radius: 999px; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; }
        .status-running { background: rgba(34, 197, 94, 0.15); color: #4ade80; }
        .status-offline { background: rgba(248, 113, 113, 0.15); color: #f87171; }
        .status-suspended { background: rgba(251, 191, 36, 0.15); color: #fbbf24; }

        .server-actions { display: flex; gap: 0.5rem; margin-top: 0.8rem; flex-wrap: wrap; }
        .server-actions button { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #94a3b8; padding: 0.3rem 0.8rem; border-radius: 0.5rem; font-size: 0.75rem; cursor: pointer; }
        .server-actions button:hover { background: rgba(124, 108, 240, 0.2); border-color: rgba(124, 108, 240, 0.4); color: #e0e5ee; }

        .console {
            background: #0d1117;
            border-radius: 0.5rem;
            padding: 0.8rem;
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            color: #94a3b8;
            max-height: 200px;
            overflow-y: auto;
            margin-top: 0.5rem;
        }

        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; font-size: 0.8rem; font-weight: 600; color: #94a3b8; text-transform: uppercase; margin-bottom: 0.4rem; }
        .form-group input, .form-group select { width: 100%; padding: 0.8rem 1.2rem; background: rgba(0,0,0,0.3); border: 1px solid rgba(100,120,200,0.15); border-radius: 0.8rem; color: #e0e5ee; font-size: 1rem; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #7c6cf0; }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: #1a1f2e;
            border-radius: 1.5rem;
            padding: 2rem;
            max-width: 500px;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        .modal-header h3 { font-size: 1.3rem; font-weight: 600; }
        .modal-close { background: none; border: none; color: #94a3b8; font-size: 1.5rem; cursor: pointer; }

        .error-msg { color: #f87171; font-size: 0.85rem; text-align: center; margin-top: 0.8rem; }
        .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.2); border-top: 2px solid #fff; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 0.5rem; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .hidden { display: none !important; }

        @media (max-width: 600px) {
            .header { flex-direction: column; gap: 1rem; align-items: stretch; }
            .user-info { flex-direction: column; gap: 0.5rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ===== HEADER ===== -->
        <div class="header">
            <div class="logo"><h1>Waevo<span>Hosting</span></h1></div>
            <div class="user-info" id="userInfo">
                <span id="userEmail" style="color:#94a3b8;font-size:0.9rem;">Invitado</span>
                <button class="btn-logout" id="logoutBtn" style="display:none;">Cerrar sesión</button>
            </div>
        </div>

        <!-- ===== DASHBOARD ===== -->
        <div id="dashboardContent">
            <div class="card">
                <h2>🚀 Bienvenido a tu panel</h2>
                <p style="color:#94a3b8;">Gestiona tu servidor desde aquí.</p>
            </div>

            <!-- Botón Create Server (visible si no tiene servidor) -->
            <div id="createServerSection">
                <button class="btn-primary" id="createServerBtn">➕ Create Server</button>
                <p style="color:#475569;font-size:0.8rem;margin-top:0.5rem;">Máximo 1 servidor por usuario.</p>
            </div>

            <!-- ===== SERVIDOR (si existe) ===== -->
            <div id="serverSection" style="display:none;">
                <div class="card">
                    <div class="server-header">
                        <span class="server-name" id="serverName">Mi Servidor</span>
                        <span class="server-status" id="serverStatus">offline</span>
                    </div>
                    <div style="font-size:0.8rem;color:#475569;margin:0.5rem 0;">
                        <strong>Server ID:</strong> <span id="serverId">-</span> &middot;
                        <strong>CPU:</strong> <span id="serverCpu">-</span>% &middot;
                        <strong>RAM:</strong> <span id="serverRam">-</span> MB &middot;
                        <strong>Disk:</strong> <span id="serverDisk">-</span> MB
                    </div>
                    <div class="server-actions">
                        <button onclick="actionServer('start')">▶️ Start</button>
                        <button onclick="actionServer('stop')">⏹️ Stop</button>
                        <button onclick="actionServer('restart')">🔄 Restart</button>
                        <button onclick="toggleSettings()">⚙️ Settings</button>
                    </div>
                    <!-- Consola -->
                    <div class="console" id="consoleLog">🔄 Cargando consola...</div>
                </div>

                <!-- ===== SETTINGS (variables de entorno, código) ===== -->
                <div id="settingsPanel" style="display:none;">
                    <div class="card">
                        <h3>⚙️ Configuración del servidor</h3>
                        <div class="form-group">
                            <label>Variables de entorno (.env)</label>
                            <textarea id="envVars" rows="4" style="width:100%;background:#0d1117;border:1px solid rgba(100,120,200,0.15);border-radius:0.8rem;color:#e0e5ee;padding:0.8rem;font-family:monospace;" placeholder="KEY=value"></textarea>
                            <button class="btn-secondary" style="margin-top:0.5rem;" onclick="saveEnv()">💾 Guardar .env</button>
                        </div>
                        <div class="form-group">
                            <label>Código principal (main.js / index.js)</label>
                            <textarea id="mainCode" rows="6" style="width:100%;background:#0d1117;border:1px solid rgba(100,120,200,0.15);border-radius:0.8rem;color:#e0e5ee;padding:0.8rem;font-family:monospace;" placeholder="console.log('Hello Waevo!');"></textarea>
                            <button class="btn-secondary" style="margin-top:0.5rem;" onclick="saveCode()">💾 Guardar código</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== MODAL: Registro / Crear cuenta ===== -->
    <div class="modal" id="registerModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>📝 Crear cuenta</h3>
                <button class="modal-close" onclick="closeModal('registerModal')">&times;</button>
            </div>
            <form id="registerForm">
                <div class="form-group">
                    <label>Correo electrónico</label>
                    <input type="email" id="regEmail" placeholder="tu@email.com" required />
                </div>
                <div class="form-group">
                    <label>Nombre de usuario</label>
                    <input type="text" id="regUsername" placeholder="usuario" required />
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="regPassword" placeholder="••••••••" required />
                </div>
                <button type="submit" class="btn-primary" style="width:100%;">Crear cuenta</button>
                <div class="error-msg" id="registerError"></div>
            </form>
        </div>
    </div>

    <!-- ===== MODAL: Selección de servicio ===== -->
    <div class="modal" id="serviceModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>🛠️ Elige un servicio</h3>
                <button class="modal-close" onclick="closeModal('serviceModal')">&times;</button>
            </div>
            <div style="display:flex;flex-direction:column;gap:1rem;">
                <button class="btn-primary" onclick="createServer('web')">🌐 Web Hosting</button>
                <button class="btn-primary" onclick="createServer('bot')">🤖 Bot Hosting (Gratis: 20% CPU, 100MB disk, 50MB RAM)</button>
            </div>
            <div class="error-msg" id="serviceError"></div>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- SCRIPTS: Firebase y lógica del panel -->
    <!-- ============================================================ -->
    <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
    <script>
        // ============================================================
        // CONFIGURACIÓN DE FIREBASE
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyD13N4-9MjTrmlPwGP7mves0Exje4v2ACw",
            authDomain: "kahoot-8529e.firebaseapp.com",
            databaseURL: "https://kahoot-8529e-default-rtdb.firebaseio.com",
            projectId: "kahoot-8529e",
            storageBucket: "kahoot-8529e.firebasestorage.app",
            messagingSenderId: "313414356056",
            appId: "1:313414356056:web:4aab4587f7df9393008e2d",
            measurementId: "G-8T4CPC1BQ3"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // ============================================================
        // REFERENCIAS DOM
        // ============================================================
        const userEmailSpan = document.getElementById('userEmail');
        const logoutBtn = document.getElementById('logoutBtn');
        const createServerBtn = document.getElementById('createServerBtn');
        const serverSection = document.getElementById('serverSection');
        const createServerSection = document.getElementById('createServerSection');

        // ============================================================
        // ESTADO GLOBAL
        // ============================================================
        let currentUser = null;
        let currentServer = null;
        let serverId = null;

        // ============================================================
        // AUTENTICACIÓN
        // ============================================================
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                currentUser = user;
                userEmailSpan.textContent = user.email;
                logoutBtn.style.display = 'inline-block';
                await loadUserServer();
            } else {
                currentUser = null;
                userEmailSpan.textContent = 'Invitado';
                logoutBtn.style.display = 'none';
                serverSection.style.display = 'none';
                createServerSection.style.display = 'block';
            }
        });

        // ============================================================
        // LOGOUT
        // ============================================================
        logoutBtn.addEventListener('click', () => {
            auth.signOut().then(() => {
                localStorage.removeItem('waevohosting_token');
                location.reload();
            });
        });

        // ============================================================
        // REGISTRO (MODAL)
        // ============================================================
        createServerBtn.addEventListener('click', () => {
            if (currentUser) {
                // Si ya está logueado, mostrar modal de servicio
                document.getElementById('serviceModal').classList.add('active');
            } else {
                // Si no, mostrar modal de registro
                document.getElementById('registerModal').classList.add('active');
            }
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('regEmail').value.trim();
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value;
            const errorEl = document.getElementById('registerError');

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, username }),
                });
                const data = await response.json();
                if (response.ok) {
                    // Iniciar sesión automáticamente con Firebase
                    await auth.signInWithEmailAndPassword(email, password);
                    closeModal('registerModal');
                    // Mostrar modal de servicio
                    document.getElementById('serviceModal').classList.add('active');
                } else {
                    errorEl.textContent = data.error || 'Error al registrar';
                }
            } catch (error) {
                errorEl.textContent = 'Error de conexión';
            }
        });

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        // ============================================================
        // CREAR SERVIDOR
        // ============================================================
        async function createServer(serviceType) {
            const errorEl = document.getElementById('serviceError');
            errorEl.textContent = '';
            try {
                const response = await fetch('/api/create-server', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: currentUser.uid, // O el ID de Pterodactyl si lo tienes
                        serviceType: serviceType,
                        serverName: `${serviceType}-server-${currentUser.email.split('@')[0]}`
                    }),
                });
                const data = await response.json();
                if (response.ok) {
                    closeModal('serviceModal');
                    await loadUserServer();
                } else {
                    errorEl.textContent = data.error || 'Error al crear servidor';
                }
            } catch (error) {
                errorEl.textContent = 'Error de conexión';
            }
        }

        // ============================================================
        // CARGAR SERVIDOR DEL USUARIO
        // ============================================================
        async function loadUserServer() {
            // Implementar lógica para obtener servidor del usuario
            // (aquí se asume que el backend devuelve el servidor del usuario)
            try {
                const response = await fetch(`/api/user-server?userId=${currentUser.uid}`);
                const data = await response.json();
                if (response.ok && data.server) {
                    currentServer = data.server;
                    serverId = currentServer.id;
                    renderServer(currentServer);
                    serverSection.style.display = 'block';
                    createServerSection.style.display = 'none';
                } else {
                    serverSection.style.display = 'none';
                    createServerSection.style.display = 'block';
                }
            } catch (error) {
                console.error('Error al cargar servidor:', error);
            }
        }

        // ============================================================
        // RENDERIZAR SERVIDOR
        // ============================================================
        function renderServer(server) {
            document.getElementById('serverName').textContent = server.name || 'Mi Servidor';
            document.getElementById('serverId').textContent = server.id || '-';
            document.getElementById('serverCpu').textContent = server.limits?.cpu || '-';
            document.getElementById('serverRam').textContent = server.limits?.memory || '-';
            document.getElementById('serverDisk').textContent = server.limits?.disk || '-';
            const statusEl = document.getElementById('serverStatus');
            statusEl.textContent = server.status || 'offline';
            statusEl.className = 'server-status ' + (server.status === 'running' ? 'status-running' : 'status-offline');
            document.getElementById('consoleLog').textContent = server.console || '📡 Consola lista...';
        }

        // ============================================================
        // ACCIONES DEL SERVIDOR
        // ============================================================
        async function actionServer(action) {
            try {
                const response = await fetch('/api/server-actions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ serverId, action }),
                });
                const data = await response.json();
                if (response.ok) {
                    await loadUserServer();
                } else {
                    alert(data.error || 'Error al ejecutar acción');
                }
            } catch (error) {
                alert('Error de conexión');
            }
        }

        // ============================================================
        // SETTINGS (variables de entorno y código)
        // ============================================================
        function toggleSettings() {
            const panel = document.getElementById('settingsPanel');
            panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
            if (panel.style.display === 'block') {
                // Cargar datos actuales
                fetch(`/api/server-details?serverId=${serverId}`)
                    .then(res => res.json())
                    .then(data => {
                        if (data.success) {
                            document.getElementById('envVars').value = data.server.environment ? JSON.stringify(data.server.environment, null, 2) : '';
                            document.getElementById('mainCode').value = data.server.script || '';
                        }
                    });
            }
        }

        async function saveEnv() {
            const env = document.getElementById('envVars').value;
            // Implementar guardado de variables de entorno
            alert('🔧 Guardar .env próximamente');
        }

        async function saveCode() {
            const code = document.getElementById('mainCode').value;
            // Implementar guardado de código
            alert('💾 Guardar código próximamente');
        }

        // ============================================================
        // INICIALIZACIÓN
        // ============================================================
        console.log('✅ Panel de usuario cargado');
    </script>
</body>
</html>
